name: Build Geode Mod (iOS)

on:
  workflow_dispatch:
  push:
    branches:
      - main

# Avoid wasting runners on intermediate commits while several files are being added.
concurrency:
  group: ios-geode-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS .geode
    runs-on: macos-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build for iOS
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          target: iOS
          sdk: given
          build-config: Release

      - name: Upload iOS Geode artifact
        uses: actions/upload-artifact@v4
        with:
          name: input-buffer-ios
          path: ${{ steps.build.outputs.build-output }}/*.geode
          if-no-files-found: error
          retention-days: 14
